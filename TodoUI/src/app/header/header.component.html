<h1>{{title}}</h1>
<hr>
<h2>Todo List</h2>


@for (todo of todos; track todo.id) {
   <div>
   <h3>{{todo.title}}</h3>
   <p>{{todo.description}}</p>
   <p>Status : @if (todo.isCompleted){
      <span>Completed</span>
      }
      @else {
         <span>Pending</span>
      }
   </p>
   <hr>  
   </div>
}




<hr>
